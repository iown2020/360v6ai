<%+header%>
<style>
.dash-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin:16px 0; }
.dash-card { background:var(--box-bg,#fff); border:1px solid var(--box-border,#e5e7eb); border-radius:12px; padding:20px; transition:transform .15s,box-shadow .15s; }
.dash-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.1); }
.dash-card h3 { margin:0 0 12px 0; font-size:14px; font-weight:600; color:var(--fg,#333); display:flex; align-items:center; gap:8px; }
.dash-card h3 .icon { font-size:18px; }
.dash-value { font-size:32px; font-weight:700; color:var(--fg,#111); line-height:1; }
.dash-value .unit { font-size:14px; font-weight:400; color:var(--fg-secondary,#888); margin-left:4px; }
.dash-sub { font-size:12px; color:var(--fg-secondary,#888); margin-top:6px; }
.dash-bar { height:8px; background:var(--bar-bg,#e5e7eb); border-radius:4px; overflow:hidden; margin-top:12px; }
.dash-bar-fill { height:100%; border-radius:4px; transition:width .5s ease; }
.dash-bar-fill.green { background:linear-gradient(90deg,#22c55e,#16a34a); }
.dash-bar-fill.blue { background:linear-gradient(90deg,#3b82f6,#2563eb); }
.dash-bar-fill.orange { background:linear-gradient(90deg,#f59e0b,#d97706); }
.dash-bar-fill.red { background:linear-gradient(90deg,#ef4444,#dc2626); }
.dash-bar-fill.purple { background:linear-gradient(90deg,#a855f7,#9333ea); }
.dash-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--divider,#f0f0f0); font-size:13px; }
.dash-row:last-child { border-bottom:none; }
.dash-row .label { color:var(--fg-secondary,#666); }
.dash-row .val { font-weight:600; color:var(--fg,#333); font-family:monospace; }
.dash-temp { display:flex; align-items:baseline; gap:4px; }
.dash-temp .num { font-size:28px; font-weight:700; }
.dash-temp .deg { font-size:16px; color:var(--fg-secondary,#888); }
.dash-net-if { margin-bottom:10px; }
.dash-net-if .ifname { font-weight:600; font-size:13px; margin-bottom:4px; display:flex; justify-content:space-between; }
.dash-net-if .ifname .state { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; }
.state-up { background:#dcfce7; color:#16a34a; }
.state-down { background:#fee2e2; color:#dc2626; }
.dash-net-rates { display:flex; gap:16px; font-size:12px; color:var(--fg-secondary,#666); font-family:monospace; }
.dash-net-rates .rx { color:#2563eb; }
.dash-net-rates .tx { color:#16a34a; }
.dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.dash-header h2 { margin:0; font-size:20px; font-weight:700; }
.dash-header .refresh { font-size:12px; color:var(--fg-secondary,#888); }
.dash-pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:6px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
</style>

<div class="dash-header">
  <h2><span class="dash-pulse"></span>系统仪表盘</h2>
  <span class="refresh" id="dash-refresh">更新中...</span>
</div>

<div class="dash-grid">
  <!-- CPU -->
  <div class="dash-card">
    <h3><span class="icon">⚡</span>CPU 使用率</h3>
    <div class="dash-value"><span id="cpu-usage">--</span><span class="unit">%</span></div>
    <div class="dash-bar"><div class="dash-bar-fill blue" id="cpu-bar" style="width:0%"></div></div>
    <div class="dash-sub">负载: <span id="cpu-load">--</span></div>
  </div>

  <!-- 内存 -->
  <div class="dash-card">
    <h3><span class="icon">💾</span>内存使用</h3>
    <div class="dash-value"><span id="mem-used">--</span><span class="unit">/ <span id="mem-total">--</span> MB</span></div>
    <div class="dash-bar"><div class="dash-bar-fill green" id="mem-bar" style="width:0%"></div></div>
    <div class="dash-sub">缓存: <span id="mem-cache">--</span> MB | 交换: <span id="mem-swap">--</span> MB</div>
  </div>

  <!-- 温度 -->
  <div class="dash-card">
    <h3><span class="icon">🌡️</span>温度</h3>
    <div id="temp-list">
      <div class="dash-value" style="font-size:18px;color:var(--fg-secondary)">读取中...</div>
    </div>
  </div>

  <!-- 运行时间 -->
  <div class="dash-card">
    <h3><span class="icon">⏱️</span>运行时间</h3>
    <div class="dash-value" id="uptime-display">--</div>
    <div class="dash-sub">连接数: <span id="conn-count">--</span> / <span id="conn-max">--</span></div>
    <div class="dash-sub" id="nss-status"></div>
  </div>
</div>

<!-- 网络流量 -->
<div class="dash-card" style="margin-bottom:16px;">
  <h3><span class="icon">🌐</span>网络接口</h3>
  <div id="net-list">
    <div class="dash-sub">读取中...</div>
  </div>
</div>

<script>
(function(){
  var prevNet = {};
  var prevTime = Date.now();

  function fmtBytes(kb) {
    if (kb >= 1048576) return (kb/1048576).toFixed(1) + ' GB';
    if (kb >= 1024) return (kb/1024).toFixed(1) + ' MB';
    return kb + ' KB';
  }
  function fmtRate(bytes, sec) {
    var bps = bytes / sec;
    if (bps >= 1048576) return (bps/1048576).toFixed(2) + ' MB/s';
    if (bps >= 1024) return (bps/1024).toFixed(1) + ' KB/s';
    return bps.toFixed(0) + ' B/s';
  }
  function barColor(pct) {
    if (pct >= 90) return 'red';
    if (pct >= 70) return 'orange';
    if (pct >= 50) return 'blue';
    return 'green';
  }

  function update() {
    fetch('/cgi-bin/dashboard-data', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var now = Date.now();
        var sec = (now - prevTime) / 1000;
        prevTime = now;

        // CPU
        document.getElementById('cpu-usage').textContent = d.cpu.usage;
        document.getElementById('cpu-bar').style.width = d.cpu.usage + '%';
        document.getElementById('cpu-bar').className = 'dash-bar-fill ' + barColor(d.cpu.usage);
        document.getElementById('cpu-load').textContent = d.cpu.load1 + ' / ' + d.cpu.load5 + ' / ' + d.cpu.load15;

        // 内存
        var memUsedMB = Math.round(d.memory.used / 1024);
        var memTotalMB = Math.round(d.memory.total / 1024);
        document.getElementById('mem-used').textContent = memUsedMB;
        document.getElementById('mem-total').textContent = memTotalMB;
        document.getElementById('mem-bar').style.width = d.memory.usage + '%';
        document.getElementById('mem-bar').className = 'dash-bar-fill ' + barColor(d.memory.usage);
        document.getElementById('mem-cache').textContent = Math.round(d.memory.cached / 1024);
        document.getElementById('mem-swap').textContent = Math.round(d.memory.swap_used / 1024);

        // 温度
        var tempHtml = '';
        if (d.temps && d.temps.length > 0) {
          d.temps.forEach(function(t){
            var color = t.temp >= 80 ? '#dc2626' : t.temp >= 65 ? '#d97706' : '#16a34a';
            tempHtml += '<div class="dash-temp" style="margin-bottom:8px;"><span class="num" style="color:'+color+'">'+t.temp+'</span><span class="deg">°C</span><span style="font-size:12px;color:var(--fg-secondary);margin-left:8px;">'+t.name+'</span></div>';
          });
        } else {
          tempHtml = '<div class="dash-value" style="font-size:16px;color:var(--fg-secondary)">未检测到温度传感器</div>';
        }
        document.getElementById('temp-list').innerHTML = tempHtml;

        // 运行时间
        var up = d.uptime.days + '天 ' + d.uptime.hours + '时 ' + d.uptime.mins + '分';
        document.getElementById('uptime-display').innerHTML = '<span style="font-size:22px;">'+up+'</span>';
        document.getElementById('conn-count').textContent = d.connections.count;
        document.getElementById('conn-max').textContent = d.connections.max;
        document.getElementById('nss-status').innerHTML = d.nss ? 'NSS 硬件加速: <span style="color:#16a34a;font-weight:600;">已启用</span>' : 'NSS: 未检测';

        // 网络
        var netHtml = '';
        if (d.network && d.network.length > 0) {
          d.network.forEach(function(iface){
            var prev = prevNet[iface.name] || {rx:0, tx:0};
            var rxRate = iface.rx > prev.rx ? iface.rx - prev.rx : 0;
            var txRate = iface.tx > prev.tx ? iface.tx - prev.tx : 0;
            prevNet[iface.name] = {rx: iface.rx, tx: iface.tx};
            var stateClass = iface.state === 'up' ? 'state-up' : 'state-down';
            var stateText = iface.state === 'up' ? 'UP' : 'DOWN';
            netHtml += '<div class="dash-net-if">' +
              '<div class="ifname"><span>'+iface.name+'</span><span class="state '+stateClass+'">'+stateText+'</span></div>' +
              '<div class="dash-net-rates">' +
                '<span class="rx">↓ '+fmtRate(rxRate, sec)+'</span>' +
                '<span class="tx">↑ '+fmtRate(txRate, sec)+'</span>' +
                '<span style="color:var(--fg-secondary)">总: '+fmtBytes(iface.rx/1024)+' / '+fmtBytes(iface.tx/1024)+'</span>' +
              '</div></div>';
          });
        } else {
          netHtml = '<div class="dash-sub">未检测到网络接口</div>';
        }
        document.getElementById('net-list').innerHTML = netHtml;

        document.getElementById('dash-refresh').textContent = '最后更新: ' + new Date().toLocaleTimeString();
      })
      .catch(function(e){
        document.getElementById('dash-refresh').textContent = '更新失败: ' + e.message;
      });
  }

  update();
  setInterval(update, 3000);
})();
</script>
<%+footer%>
