name: 360V6 OpenWRT NSS Firmware Build

on:
  workflow_dispatch:

# Release 需要写权限：仓库 Settings → Actions → General → Workflow permissions
# 必须选 "Read and write permissions"
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/laipeng668/openwrt-6.x.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/IPQ60XX.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      - name: Clone NSS source
        run: |
          set -eux
          cd $GITHUB_WORKSPACE
          git clone --depth 1 -b $REPO_BRANCH --single-branch $REPO_URL openwrt 2>&1 || {
            echo "=== git clone failed, retrying ==="
            rm -rf openwrt
            git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          }
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo "=== source version ==="
          git log -1 --oneline
          echo ""
          echo "=== kernel version ==="
          ls target/linux/generic/kernel-* || echo "no kernel version file"
          echo ""
          echo "=== check 360V6 device support ==="
          find target/linux/qualcommax -name "*qihoo*" -o -name "*360v6*" 2>/dev/null | head -20

      - name: Generate env
        run: |
          cp $GITHUB_WORKSPACE/$CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1
          SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

      # 工具链缓存：二次编译可省 1-2 小时
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
          path: |
            ${{ env.OPENWRT_PATH }}/.ccache
            ${{ env.OPENWRT_PATH }}/staging_dir

      # 源码包缓存：dl 内容由 源码仓库 + feed 脚本 决定，与固件配置无关，
      # 单独打 key 可跨提交复用，避免每次 make download 重下几百 MB
      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-dl-${{ hashFiles('scripts/Roc-script.sh') }}
          restore-keys: |
            ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-dl-
          path: ${{ env.OPENWRT_PATH }}/dl

      # 缓存恢复后刷新 stamp 时间戳，避免 OpenWrt 误判工具链过期全量重建
      - name: Refresh cache timestamps
        run: |
          if [ -d "$OPENWRT_PATH/staging_dir" ]; then
            find "$OPENWRT_PATH/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      # feeds 处理与 EasyTier feed 注册统一在 Roc-script.sh 内完成
      - name: Run custom script (feeds + EasyTier + files)
        run: |
          chmod +x $DIY_SCRIPT
          cd $OPENWRT_PATH
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: Write final config & Download deps
        run: |
          cd $OPENWRT_PATH
          cat $GITHUB_WORKSPACE/$CONFIG_FILE $GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE > .config
          if ! make defconfig 2>&1 | tee /tmp/defconfig.log; then
            echo "=== defconfig failed, check unknown symbols ==="
            grep -i "unknown\|error\|warning.*symbol" /tmp/defconfig.log || true
            exit 1
          fi
          echo "=== target device ==="
          grep "CONFIG_TARGET_DEVICE" .config
          echo ""
          echo "=== ath11k mem profile ==="
          grep "ATH11K_MEM_PROFILE" .config
          echo ""
          echo "=== selected packages count ==="
          grep -c "^CONFIG_PACKAGE_.*=y" .config
          echo ""

          # 编译前预检：有错立刻失败，避免白编译数小时
          echo "=== pre-flight checks ==="
          FAIL=0
          grep -q 'CONFIG_TARGET_BOARD="qualcommax"' .config \
            || { echo "[FAIL] 目标平台不是 qualcommax"; FAIL=1; }
          grep -qE 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_.*360v6=y' .config \
            || { echo "[FAIL] 目标设备未选中 360v6"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=y' .config \
            || { echo "[FAIL] OpenClash 未启用"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_luci-app-easytier=y' .config \
            || { echo "[FAIL] luci-app-easytier 未启用（EasyTier feed 注册失败？）"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_easytier=y' .config \
            || { echo "[FAIL] easytier 主程序未启用"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_luci-theme-aurora=y' .config \
            || { echo "[FAIL] Aurora 主题未启用"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_luci-app-dashboard=y' .config \
            || { echo "[FAIL] 自定义仪表盘未启用"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_cpufreq=y' .config \
            || { echo "[FAIL] cpufreq 调频服务未启用"; FAIL=1; }
          # zram：swap 服务与 kmod 必须真正落地；LZ4 后端若被 defconfig 丢弃会自动回退 lzo，
          # 因此只告警，不阻断编译
          grep -q '^CONFIG_PACKAGE_zram-swap=y' .config \
            || { echo "[FAIL] zram-swap 未启用（busybox swap 工具依赖未满足？）"; FAIL=1; }
          grep -q '^CONFIG_PACKAGE_kmod-zram=y' .config \
            || { echo "[FAIL] kmod-zram 未启用"; FAIL=1; }
          grep -q '^CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y' .config \
            || echo "[WARN] zram LZ4 后端未生效，运行时将回退 lzo"
          grep -q '^CONFIG_ATH11K_MEM_PROFILE_512M=y' .config \
            || echo "[WARN] ath11k 512M 内存 Profile 未生效"
          if grep -qE '^CONFIG_PACKAGE_luci-app-(passwall|passwall2)=y' .config; then
            echo "[FAIL] PassWall 仍在配置中"; FAIL=1
          fi
          # NSS 符号为软校验：laipeng668 源码中由设备 DEFAULT_PACKAGES 隐式提供，
          # 包名可能随上游调整，缺失只警告不阻断
          for sym in kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-dp; do
            grep -q "^CONFIG_PACKAGE_${sym}=y" .config \
              || echo "[WARN] NSS 符号未出现: CONFIG_PACKAGE_${sym}"
          done
          [ $FAIL -eq 1 ] && { echo "=== 预检失败，终止（避免无效编译） ==="; exit 1; }
          echo "=== 预检通过 ==="

          make download -j$(nproc)
          # 清理损坏的小下载（CDN 返回的 HTML 错误页等），防止编译期 Bad archive
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Compile
        id: compile
        run: |
          cd $OPENWRT_PATH
          echo "=== start compile ==="
          echo "CPU cores: $(nproc)"
          # 1) tools 阶段：并行失败转串行
          timeout 5400 make -j$(nproc) tools/compile || { echo "tools parallel failed, retry serial"; timeout 5400 make -j1 V=s tools/compile || true; }
          # 2) 全量：并行失败转串行
          timeout 9000 make -j$(nproc) || { echo "build failed, retry serial"; timeout 9000 make -j1 V=s; }
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check disk space
        if: (!cancelled())
        run: df -hT

      - name: Collect firmware
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd $OPENWRT_PATH/bin/targets/*/*
          echo "=== firmware files ==="
          ls -lh *.bin *.ubi 2>/dev/null || echo "no .bin/.ubi found"
          echo ""
          echo "=== 360V6 files ==="
          find . -name "*qihoo*360v6*" -o -name "*360v6*" 2>/dev/null
          echo ""
          echo "=== firmware size ==="
          du -sh .
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "DATE_VERSION=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      # Release 发布固件（需要 contents: write，见顶部 permissions）
      # tag 用 run_number 保证唯一；name 带日期版本便于识别
      - name: Release
        if: steps.compile.outputs.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: R${{ github.run_number }}
          name: 360V6 NSS 固件 ${{ env.DATE_VERSION }} (build ${{ github.run_number }})
          generate_release_notes: true
          body: |
            **源码**：laipeng668/openwrt-6.x `25.12-nss`（Linux 6.12 + QCA NSS v11.4，NSS drv/ecm/dp 由设备默认包内置）
            **目标**：qualcommax / ipq60xx / `qihoo_360v6`，512MB 内存（ath11k 512M Profile）
            **版本**：R${{ env.DATE_VERSION }} / build ${{ github.run_number }}

            ## 基本网络设置
            | 项目 | 默认值 |
            |---|---|
            | 后台地址 | http://192.168.50.1 |
            | 登录用户 | root（密码为空，首次登录请自行设置） |
            | 无线 SSID | 2024（2.4G / 5G 同名） |
            | 无线密码 | 20242024（纯 WPA2-PSK，已关闭 WPA3 / PMF） |
            | 发射功率 | 5G 23dBm / 2.4G 20dBm，国家码 CN |
            | CPU | 上限锁 1.2GHz（cpufreq 服务，performance 策略，系统 → CPU Freq 页可改） |
            | 交换分区 | zram 256MB（LZ4） |

            ## 预装插件
            - **管理**：LuCI 简体中文 + Aurora 主题 + 自定义系统仪表盘（默认首页 /admin/dashboard）
            - **加速**：NSS 全套驱动 + ECM（fw4 软件/硬件分流已关闭，由 NSS 独占）
            - **代理**：OpenClash
            - **组网**：EasyTier 2.4.5
            - **共享**：Samba4 + USB 存储（ext4 / vfat / msdos，自动挂载）
            - **运维**：网络唤醒 wol、定时重启 autoreboot、UPnP、autocore 硬件状态
            - **工具**：bash、htop、nano、ttyd 终端、SFTP

            ## 刷机方式
            - **sysupgrade**：LuCI「系统 → 备份/升级」上传 `*sysupgrade.bin`；跨版本建议不保留配置
            - **救砖**：U-Boot + TFTP 刷入 `*factory.ubi`（如产物包含该文件）

            ## 校验
            - 附件 `sha256sums` 用于校验镜像完整性
            - 刷后 `lsmod | grep nss` 应看到 qca-nss-drv / qca-nss-ecm / qca-nss-dp
            - 满速下载时 CPU 占用应低于 20%（NSS 硬件转发生效）
          files: |
            ${{ env.FIRMWARE_PATH }}/*360v6*
            ${{ env.FIRMWARE_PATH }}/sha256sums
            ${{ env.FIRMWARE_PATH }}/config.buildinfo

      - name: Upload failed log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failed-log
          path: ${{ env.OPENWRT_PATH }}/logs/
          retention-days: 7
