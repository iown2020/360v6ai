# ============================================================
# 360V6 内核调优：内存保护 + 网络栈优化
#
# 注: NSS ECM 硬件转发流量不经过下面的内核 TCP 栈参数;
#     这些调优只对 OpenClash / EasyTier / Wi-Fi 数据面生效
# ============================================================

# --- 内存保护 ---
# 预留 16MB 连续物理保留内存，防范 ath11k GFP_ATOMIC 分配失败死锁
vm.min_free_kbytes=16384

# 激进回收目录项和索引节点缓存（释放 Slab）
vm.vfs_cache_pressure=150

# 最小化匿名页换页（只在内存完全耗尽时才换，延后 zram 换页延迟）
vm.swappiness=1

# --- 网络栈基础 ---
# 网卡收包队列长度，千兆高并发下 1000 容易溢出丢包
net.core.netdev_max_backlog=4096

# socket accept 队列，OpenClash tproxy 高并发不炸
net.core.somaxconn=4096

# TCP Fast Open，省一次握手 RTT（3=启用客户端+服务端）
net.ipv4.tcp_fastopen=3

# TIME_WAIT 端口可复用，高并发下端口不浪费
net.ipv4.tcp_tw_reuse=1

# --- 拥塞控制: BBR + fq ---
# BBR 对高 RTT / 轻微丢包链路（代理、EasyTier）吞吐显著优于 cubic
# 需要 CONFIG_PACKAGE_kmod-tcp-bbr 编译进内核，否则会静默失败
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# --- 高 BDP TCP 缓冲上限 ---
# 1Gbps × 200ms ≈ 25MB; 512MB 内存取 16MB 上限，避免预分配
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216

# --- 高并发连接（OpenClash + 多设备 + P2P）---
# 65536 conntrack ≈ 20-30MB，512MB 内存可承受
net.netfilter.nf_conntrack_max=65536

# 扩大本地可用端口范围，避免高 TIME_WAIT 耗尽端口
net.ipv4.ip_local_port_range=10000 65535

# SYN 队列与 TIME_WAIT 上限
net.ipv4.tcp_max_syn_backlog=4096
net.ipv4.tcp_max_tw_buckets=65536
net.ipv4.tcp_fin_timeout=15

# --- NAPI / 邻居表（多设备、EasyTier 多 peer）---
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.ipv4.neigh.default.gc_thresh1=512
net.ipv4.neigh.default.gc_thresh2=1024
net.ipv4.neigh.default.gc_thresh3=2048

# --- 隧道 / PPPoE MTU 探测 ---
# 启用 PMTU 发现 + 降低 base_mss，让 EasyTier / OpenClash 内层大包不走分片
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_base_mss=1024
