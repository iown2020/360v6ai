# ============================================================
# 360V6 内核调优：内存保护 + 网络栈优化
# ============================================================

# --- 内存保护 ---
# 预留 16MB 连续物理保留内存，防范 ath11k GFP_ATOMIC 分配失败死锁
vm.min_free_kbytes=16384

# 激进回收目录项和索引节点缓存（释放 Slab）
vm.vfs_cache_pressure=150

# 最小化匿名页换页（只在内存完全耗尽时才换，延后 zram 换页延迟）
vm.swappiness=1

# --- 网络栈优化（千兆路由高并发扛突发）---
# 网卡收包队列长度，千兆高并发下 1000 容易溢出丢包
net.core.netdev_max_backlog=4096

# socket accept 队列，OpenClash tproxy 高并发不炸
net.core.somaxconn=4096

# TCP Fast Open，省一次握手 RTT（3=启用客户端+服务端）
net.ipv4.tcp_fastopen=3

# TIME_WAIT 端口可复用，高并发下端口不浪费
net.ipv4.tcp_tw_reuse=1
